apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aevrel-target
spec:
  serviceName: aevrel-target
  replicas: 3
  selector:
    matchLabels:
      app: aevrel-target
  template:
    metadata:
      labels:
        app: aevrel-target
    spec:
      containers:
        - name: writer
          image: ghcr.io/example/aevrel:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              rank="${HOSTNAME##*-}"
              exec aevrel apply \
                --spec /config/client.yaml \
                --plan /config/plan.json \
                --target-rank "$rank" \
                --target-root /checkpoints
          volumeMounts:
            - name: config
              mountPath: /config
            - name: checkpoint
              mountPath: /checkpoints
      volumes:
        - name: config
          configMap:
            name: aevrel-target-spec
  volumeClaimTemplates:
    - metadata:
        name: checkpoint
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 100Gi
