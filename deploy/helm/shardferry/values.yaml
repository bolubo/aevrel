image:
  controller: ghcr.io/bolubo/shardferry-controller:0.1.1
  gateway: ghcr.io/bolubo/shardferry-gateway:0.1.1
  agent: ghcr.io/bolubo/shardferry-agent:0.1.1
  pullPolicy: IfNotPresent

agentToken:
  existingSecret: shardferry-agent-token
  key: token

tls:
  enabled: true
  controllerSecretName: shardferry-controller-tls
  agentSecretName: shardferry-agent-tls
  caKey: ca.crt
  certKey: tls.crt
  keyKey: tls.key

controller:
  enabled: true
  replicas: 1
  serviceType: ClusterIP
  nodePort: 0
  artifactPublicURL: ""
  servicePort: 8082
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

gateway:
  enabled: false
  replicas: 1
  bindAddress: ":9445"
  port: 9445
  serviceType: ClusterIP
  nodePort: 0
  # Must be reachable from the management cluster. Set to a LoadBalancer,
  # Ingress or port-forward URL in real cross-cluster deployments.
  publicURL: ""
  clusterName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  gatewayToken:
    existingSecret: shardferry-agent-token
    key: token
  agentToken:
    existingSecret: shardferry-agent-token
    key: token
  resources: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

artifacts:
  existingClaim: ""
  size: 100Gi
  storageClassName: ""

source:
  enabled: true
  gpuCodec: ""
  gpuCodecNetworkGbps: ""
  runBatchBytes: 4194304
  # Optional. Use a gateway proxy URL for cross-cluster range access, e.g.
  # http://source-gateway:9445/v1/agents/{pod}
  publicURL: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  checkpointHostPath: /var/lib/shardferry/source
  # Required on metadataOwnerRank. Other peers can receive the small
  # .metadata file through the agent metadata-transfer API.
  metadataHostPath: /var/lib/shardferry/metadata
  stateHostPath: /var/lib/shardferry/source-state
  port: 9443
  cacheBytes: 536870912
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

target:
  enabled: false
  gpuCodec: ""
  gpuCodecNetworkGbps: ""
  runBatchBytes: 4194304
  nodeSelector: {}
  tolerations: []
  affinity: {}
  checkpointHostPath: /var/lib/shardferry/target
  stateHostPath: /var/lib/shardferry/target-state
  loadSmoke: false
  port: 9444
  cacheBytes: 536870912
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
