apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shardferry.fullname" . }}-controller
  labels:
    {{- include "shardferry.labels" . | nindent 4 }}
rules:
  - apiGroups: ["shardferry.io"]
    resources: ["checkpointmigrations"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["shardferry.io"]
    resources: ["checkpointmigrations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["shardferry.io"]
    resources: ["shardferryclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shardferry.fullname" . }}-controller
  labels:
    {{- include "shardferry.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shardferry.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "shardferry.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
