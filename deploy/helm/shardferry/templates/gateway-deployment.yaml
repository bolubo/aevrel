{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shardferry.fullname" . }}-gateway
  labels:
    {{- include "shardferry.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shardferry.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "shardferry.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: {{ include "shardferry.fullname" . }}-controller
      securityContext:
        {{- toYaml .Values.gateway.securityContext | nindent 8 }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.gateway }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --bind-address={{ .Values.gateway.bindAddress }}
            - --public-url={{ required "gateway.publicURL is required when gateway.enabled" .Values.gateway.publicURL }}
            - --cluster-name={{ default .Release.Name .Values.gateway.clusterName }}
            - --namespace={{ .Release.Namespace }}
            - --version={{ .Chart.AppVersion }}
            {{- if .Values.tls.enabled }}
            - --tls-cert=/tls/{{ .Values.tls.certKey }}
            - --tls-key=/tls/{{ .Values.tls.keyKey }}
            - --tls-client-ca=/tls/{{ .Values.tls.caKey }}
            - --agent-ca=/tls/{{ .Values.tls.caKey }}
            - --agent-cert=/tls/{{ .Values.tls.certKey }}
            - --agent-key=/tls/{{ .Values.tls.keyKey }}
            {{- end }}
          env:
            - name: SHARDFERRY_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.gatewayToken.existingSecret }}
                  key: {{ .Values.gateway.gatewayToken.key }}
            - name: SHARDFERRY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.agentToken.existingSecret }}
                  key: {{ .Values.gateway.agentToken.key }}
          ports:
            - name: gateway
              containerPort: {{ .Values.gateway.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
              scheme: {{ if .Values.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: gateway
              scheme: {{ if .Values.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.agentSecretName }}
      {{- end }}
{{- end }}
