{{- if .Values.kueueAdapter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shardferry.fullname" . }}-kueue-adapter
  labels:
    {{- include "shardferry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.kueueAdapter.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shardferry.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: kueue-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "shardferry.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: kueue-adapter
    spec:
      serviceAccountName: {{ include "shardferry.fullname" . }}-kueue-adapter
      securityContext:
        {{- toYaml .Values.kueueAdapter.securityContext | nindent 8 }}
      {{- with .Values.kueueAdapter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kueueAdapter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kueueAdapter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: adapter
          image: "{{ .Values.image.kueueAdapter }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --strict={{ .Values.kueueAdapter.strict }}
            - --preemption-config-name={{ .Values.kueueAdapter.preemptionConfigName }}
            - --observation-source={{ .Values.kueueAdapter.observationSource }}
            - --protect-progress-gte={{ .Values.kueueAdapter.protectProgressGTE }}
            - --require-checkpoint-complete={{ .Values.kueueAdapter.requireCheckpointComplete }}
            - --protect-unknown={{ .Values.kueueAdapter.protectUnknown }}
            - --sync-interval={{ .Values.kueueAdapter.syncInterval }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            {{- toYaml .Values.kueueAdapter.resources | nindent 12 }}
{{- end }}
