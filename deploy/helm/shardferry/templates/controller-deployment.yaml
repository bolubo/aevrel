{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shardferry.fullname" . }}-controller
  labels:
    {{- include "shardferry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shardferry.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "shardferry.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "shardferry.fullname" . }}-controller
      securityContext:
        {{- toYaml .Values.controller.securityContext | nindent 8 }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.controller }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --artifact-public-url={{ include "shardferry.artifactURL" . }}
            - --artifact-bind-address=:{{ .Values.controller.servicePort }}
            - --artifact-dir=/var/lib/shardferry/artifacts
            - --leader-elect=true
            {{- if .Values.controller.liveURL }}
            - --live-url={{ .Values.controller.liveURL }}
            {{- else if .Values.liveWorker.enabled }}
            - --live-url=http://{{ include "shardferry.fullname" . }}-live-worker:{{ .Values.liveWorker.servicePort }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - --agent-ca=/tls/{{ .Values.tls.caKey }}
            - --agent-cert=/tls/{{ .Values.tls.certKey }}
            - --agent-key=/tls/{{ .Values.tls.keyKey }}
            - --artifact-tls-cert=/tls/{{ .Values.tls.certKey }}
            - --artifact-tls-key=/tls/{{ .Values.tls.keyKey }}
            - --artifact-tls-client-ca=/tls/{{ .Values.tls.caKey }}
            {{- end }}
          env:
            - name: SHARDFERRY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agentToken.existingSecret }}
                  key: {{ .Values.agentToken.key }}
            {{- if and .Values.controller.liveURL .Values.controller.liveToken.existingSecret }}
            - name: SHARDFERRY_LIVE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.liveToken.existingSecret }}
                  key: {{ .Values.controller.liveToken.key }}
            {{- else if and .Values.liveWorker.enabled .Values.liveWorker.token.existingSecret }}
            - name: SHARDFERRY_LIVE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.liveWorker.token.existingSecret }}
                  key: {{ .Values.liveWorker.token.key }}
            {{- end }}
          ports:
            - name: artifacts
              containerPort: {{ .Values.controller.servicePort }}
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/shardferry/artifacts
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-artifacts" (include "shardferry.fullname" .)) .Values.artifacts.existingClaim }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.controllerSecretName }}
        {{- end }}
{{- end }}
