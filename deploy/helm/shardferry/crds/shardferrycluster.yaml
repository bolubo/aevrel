apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shardferryclusters.shardferry.io
spec:
  group: shardferry.io
  names:
    kind: ShardferryCluster
    listKind: ShardferryClusterList
    plural: shardferryclusters
    singular: shardferrycluster
    shortNames:
      - sfc
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - endpoint
                - secretRef
              properties:
                role:
                  type: string
                  enum:
                    - source
                    - target
                    - both
                  default: both
                endpoint:
                  type: string
                  minLength: 1
                secretRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                    key:
                      type: string
                description:
                  type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
                version:
                  type: string
                message:
                  type: string
                lastSeen:
                  type: string
