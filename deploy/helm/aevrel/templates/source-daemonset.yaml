{{- if .Values.source.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "aevrel.fullname" . }}-source
  labels:
    {{- include "aevrel.labels" . | nindent 4 }}
    app.kubernetes.io/component: source
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aevrel.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: source
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aevrel.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: source
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        {{- toYaml .Values.source.securityContext | nindent 8 }}
      {{- with .Values.source.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.source.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.source.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: source-agent
          image: "{{ .Values.image.agent }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - agent
            - --listen=0.0.0.0:{{ .Values.source.port }}
            - --state-dir=/var/lib/aevrel/state
            - --checkpoint=/checkpoints
            - --metadata=/metadata
            - --public-url={{ if .Values.source.publicURL }}{{ .Values.source.publicURL }}{{ else }}{{ if .Values.tls.enabled }}https{{ else }}http{{ end }}://${NODE_IP}:{{ .Values.source.port }}{{ end }}
            - --artifact-base-url={{ include "aevrel.artifactURL" . }}
            - --cache-bytes={{ .Values.source.cacheBytes | int64 }}
            {{- if .Values.tls.enabled }}
            - --tls-cert=/tls/{{ .Values.tls.certKey }}
            - --tls-key=/tls/{{ .Values.tls.keyKey }}
            - --tls-ca=/tls/{{ .Values.tls.caKey }}
            {{- end }}
          env:
            - name: AEVREL_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agentToken.existingSecret }}
                  key: {{ .Values.agentToken.key }}
            - name: AEVREL_GPU_CODEC
              value: {{ .Values.source.gpuCodec | quote }}
            - name: AEVREL_GPU_CODEC_NETWORK_GBPS
              value: {{ .Values.source.gpuCodecNetworkGbps | quote }}
            - name: AEVREL_RUN_BATCH_BYTES
              value: {{ .Values.source.runBatchBytes | quote }}
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.tls.enabled }}
            - name: AEVREL_TLS_CA
              value: /tls/{{ .Values.tls.caKey }}
            - name: AEVREL_TLS_CERT
              value: /tls/{{ .Values.tls.certKey }}
            - name: AEVREL_TLS_KEY
              value: /tls/{{ .Values.tls.keyKey }}
            {{- end }}
          ports:
            - name: agent
              containerPort: {{ .Values.source.port }}
              hostPort: {{ .Values.source.port }}
          volumeMounts:
            - name: checkpoints
              mountPath: /checkpoints
              readOnly: true
            - name: metadata
              mountPath: /metadata
              readOnly: true
            - name: state
              mountPath: /var/lib/aevrel
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: checkpoints
          hostPath:
            path: {{ .Values.source.checkpointHostPath }}
            type: Directory
        - name: metadata
          hostPath:
            path: {{ .Values.source.metadataHostPath }}
            type: Directory
        - name: state
          hostPath:
            path: {{ .Values.source.stateHostPath }}
            type: DirectoryOrCreate
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.agentSecretName }}
        {{- end }}
{{- end }}
