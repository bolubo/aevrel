{{- if .Values.controller.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aevrel.fullname" . }}-controller
  labels:
    {{- include "aevrel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.controller.serviceType }}
  selector:
    app.kubernetes.io/name: {{ include "aevrel.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller
  ports:
    - name: artifacts
      port: {{ .Values.controller.servicePort }}
      targetPort: artifacts
      {{- if .Values.controller.nodePort }}
      nodePort: {{ .Values.controller.nodePort }}
      {{- end }}
{{- end }}
