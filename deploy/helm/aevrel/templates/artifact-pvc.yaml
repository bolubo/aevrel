{{- if and .Values.controller.enabled (not .Values.artifacts.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aevrel.fullname" . }}-artifacts
  labels:
    {{- include "aevrel.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.artifacts.size }}
  {{- if .Values.artifacts.storageClassName }}
  storageClassName: {{ .Values.artifacts.storageClassName }}
  {{- end }}
{{- end }}
