{{- if .Values.kueueAdapter.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aevrel.fullname" . }}-kueue-adapter
  labels:
    {{- include "aevrel.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["clusterqueues", "preemptionconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aevrel.dev"]
    resources: ["checkpointrecords"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aevrel.fullname" . }}-kueue-adapter
  labels:
    {{- include "aevrel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aevrel.fullname" . }}-kueue-adapter
subjects:
  - kind: ServiceAccount
    name: {{ include "aevrel.fullname" . }}-kueue-adapter
    namespace: {{ .Release.Namespace }}
{{- end }}
