{{- if .Values.target.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "aevrel.fullname" . }}-target
  labels:
    {{- include "aevrel.labels" . | nindent 4 }}
    app.kubernetes.io/component: target
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aevrel.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: target
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aevrel.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: target
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        {{- toYaml .Values.target.securityContext | nindent 8 }}
      {{- with .Values.target.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.target.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.target.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: target-agent
          image: "{{ .Values.image.agent }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - agent
            - --listen=0.0.0.0:{{ .Values.target.port }}
            - --state-dir=/var/lib/aevrel/state
            - --target-root=/targets
            - --artifact-base-url={{ include "aevrel.artifactURL" . }}
            - --cache-bytes={{ .Values.target.cacheBytes | int64 }}
            {{- if .Values.target.loadSmoke }}
            - --load-smoke
            {{- end }}
            {{- if .Values.tls.enabled }}
            - --tls-cert=/tls/{{ .Values.tls.certKey }}
            - --tls-key=/tls/{{ .Values.tls.keyKey }}
            - --tls-ca=/tls/{{ .Values.tls.caKey }}
            {{- end }}
          env:
            - name: AEVREL_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agentToken.existingSecret }}
                  key: {{ .Values.agentToken.key }}
            - name: AEVREL_GPU_CODEC
              value: {{ .Values.target.gpuCodec | quote }}
            - name: AEVREL_GPU_CODEC_NETWORK_GBPS
              value: {{ .Values.target.gpuCodecNetworkGbps | quote }}
            - name: AEVREL_RUN_BATCH_BYTES
              value: {{ .Values.target.runBatchBytes | quote }}
            {{- if .Values.tls.enabled }}
            - name: AEVREL_TLS_CA
              value: /tls/{{ .Values.tls.caKey }}
            - name: AEVREL_TLS_CERT
              value: /tls/{{ .Values.tls.certKey }}
            - name: AEVREL_TLS_KEY
              value: /tls/{{ .Values.tls.keyKey }}
            {{- end }}
          ports:
            - name: agent
              containerPort: {{ .Values.target.port }}
              hostPort: {{ .Values.target.port }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/aevrel
            - name: checkpoints
              mountPath: /targets
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: state
          hostPath:
            path: {{ .Values.target.stateHostPath }}
            type: DirectoryOrCreate
        - name: checkpoints
          hostPath:
            path: {{ .Values.target.checkpointHostPath }}
            type: DirectoryOrCreate
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.agentSecretName }}
        {{- end }}
{{- end }}
