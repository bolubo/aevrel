image:
  controller: ghcr.io/bolubo/aevrel-controller:0.3.0
  gateway: ghcr.io/bolubo/aevrel-gateway:0.3.0
  agent: ghcr.io/bolubo/aevrel-agent:0.3.0
  liveWorker: ghcr.io/bolubo/aevrel-live-worker:0.3.0
  kueueAdapter: ghcr.io/bolubo/aevrel-kueue-adapter:0.3.0
  pullPolicy: IfNotPresent

agentToken:
  existingSecret: aevrel-agent-token
  key: token

tls:
  enabled: true
  controllerSecretName: aevrel-controller-tls
  agentSecretName: aevrel-agent-tls
  caKey: ca.crt
  certKey: tls.crt
  keyKey: tls.key

controller:
  enabled: true
  replicas: 1
  serviceType: ClusterIP
  nodePort: 0
  artifactPublicURL: ""
  servicePort: 8082
  # Optional LRS executor. Set this only when the Python live service
  # implements POST /v1/live/reconcile.
  liveURL: ""
  liveToken:
    existingSecret: ""
    key: token
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

liveWorker:
  enabled: false
  replicas: 1
  servicePort: 9460
  stateSize: 10Gi
  stateStorageClassName: ""
  # Set controller.liveURL to the Service URL when enabled:
  # http://<release>-aevrel-live-worker:9460
  token:
    existingSecret: ""
    key: token
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

kueueAdapter:
  enabled: false
  replicas: 1
  strict: true
  preemptionConfigName: checkpoint-guard
  createPreemptionConfig: true
  fallbackValue: 1
  observationSource: auto
  protectProgressGTE: "0.8"
  requireCheckpointComplete: true
  protectUnknown: true
  syncInterval: 30s
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

gateway:
  enabled: false
  replicas: 1
  bindAddress: ":9445"
  port: 9445
  serviceType: ClusterIP
  nodePort: 0
  # Must be reachable from the management cluster. Set to a LoadBalancer,
  # Ingress or port-forward URL in real cross-cluster deployments.
  publicURL: ""
  clusterName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  gatewayToken:
    existingSecret: aevrel-agent-token
    key: token
  agentToken:
    existingSecret: aevrel-agent-token
    key: token
  resources: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

artifacts:
  existingClaim: ""
  size: 100Gi
  storageClassName: ""

source:
  enabled: true
  gpuCodec: ""
  gpuCodecNetworkGbps: ""
  runBatchBytes: 4194304
  # Optional. Use a gateway proxy URL for cross-cluster range access, e.g.
  # http://source-gateway:9445/v1/agents/{pod}
  publicURL: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  checkpointHostPath: /var/lib/aevrel/source
  # Required on metadataOwnerRank. Other peers can receive the small
  # .metadata file through the agent metadata-transfer API.
  metadataHostPath: /var/lib/aevrel/metadata
  stateHostPath: /var/lib/aevrel/source-state
  port: 9443
  cacheBytes: 536870912
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

target:
  enabled: false
  gpuCodec: ""
  gpuCodecNetworkGbps: ""
  runBatchBytes: 4194304
  nodeSelector: {}
  tolerations: []
  affinity: {}
  checkpointHostPath: /var/lib/aevrel/target
  stateHostPath: /var/lib/aevrel/target-state
  loadSmoke: false
  port: 9444
  cacheBytes: 536870912
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
