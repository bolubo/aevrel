apiVersion: batch/v1
kind: Job
metadata:
  name: high-priority-preemptor
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: user-queue
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      priorityClassName: training-high
      containers:
      - name: trainer
        image: busybox:1.36
        command: ["sh", "-c", "sleep 3600"]
        resources:
          requests:
            cpu: "1"
            memory: 64Mi
