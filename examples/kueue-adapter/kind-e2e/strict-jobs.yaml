apiVersion: batch/v1
kind: Job
metadata:
  name: protected-train
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: user-queue
  annotations:
    shardferry.io/preemption-protection: "enabled"
    shardferry.io/training-progress-percent: "90"
    shardferry.io/checkpoint-complete: "1"
    shardferry.io/checkpoint-version: "step-9000"
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      priorityClassName: training-low
      containers:
      - name: trainer
        image: busybox:1.36
        command: ["sh", "-c", "sleep 3600"]
        resources:
          requests:
            cpu: "1"
            memory: 64Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eligible-train
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: user-queue
  annotations:
    shardferry.io/preemption-protection: "enabled"
    shardferry.io/training-progress-percent: "10"
    shardferry.io/checkpoint-complete: "1"
    shardferry.io/checkpoint-version: "step-1000"
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      priorityClassName: training-low
      containers:
      - name: trainer
        image: busybox:1.36
        command: ["sh", "-c", "sleep 3600"]
        resources:
          requests:
            cpu: "1"
            memory: 64Mi
