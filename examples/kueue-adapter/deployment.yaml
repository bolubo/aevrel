apiVersion: apps/v1
kind: Deployment
metadata:
  name: shardferry-kueue-adapter
  namespace: shardferry-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shardferry-kueue-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shardferry-kueue-adapter
    spec:
      serviceAccountName: shardferry-kueue-adapter
      containers:
      - name: adapter
        image: shardferry-kueue-adapter:dev
        imagePullPolicy: IfNotPresent
        args:
        - --strict=true
        - --preemption-config-name=checkpoint-guard
        - --protect-progress-gte=0.8
        - --require-checkpoint-complete=true
        - --protect-unknown=true
        - --sync-interval=30s
        - --observation-source=auto
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
