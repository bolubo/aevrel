apiVersion: v1
kind: Namespace
metadata:
  name: shardferry-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shardferry-kueue-adapter
  namespace: shardferry-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shardferry-kueue-adapter
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - shardferry.io
  resources:
  - checkpointrecords
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - workloads
  verbs:
  - get
  - list
  - watch
  - patch
  - update
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - clusterqueues
  - preemptionconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shardferry-kueue-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shardferry-kueue-adapter
subjects:
- kind: ServiceAccount
  name: shardferry-kueue-adapter
  namespace: shardferry-system
