apiVersion: batch/v1
kind: Job
metadata:
  generateName: cpu-handoff-target-
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: reporter
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          set -eu
          rank="${JOB_COMPLETION_INDEX:-0}"
          cat > /dev/termination-log <<EOF
          {"schemaVersion":"1","migrationUID":"handoff-cpu","version":"${SHARDFERRY_VERSION}","rank":${rank},"role":"worker","modelLoaded":true,"optimizerLoaded":true,"stepsRan":${SHARDFERRY_VALIDATION_STEPS},"stateComplete":false,"ok":true,"error":""}
          EOF
