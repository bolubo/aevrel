apiVersion: shardferry.io/v1
kind: RestoreDrill
metadata:
  name: training-step-100
  namespace: default
spec:
  recordRef: training-step-100
  version: step-100
  targetWorldSize: 8
  steps: 10
  timeoutSeconds: 900
  checkpointTemplate: /targets/training/step-100/rank{rank}
  jobTemplate:
    apiVersion: batch/v1
    kind: Job
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: restore
              image: ghcr.io/example/trainer:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  rank="${JOB_COMPLETION_INDEX:?}"
                  checkpoint="${SHARDFERRY_CHECKPOINT_TEMPLATE//\{rank\}/$rank}"
                  python train_resume.py \
                    --checkpoint "$checkpoint" \
                    --steps "$SHARDFERRY_VALIDATION_STEPS"
                  shardferry-target-report \
                    --model-loaded \
                    --optimizer-loaded \
                    --steps-ran "$SHARDFERRY_VALIDATION_STEPS"
