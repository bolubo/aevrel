apiVersion: aevrel.dev/v1
kind: CheckpointMigration
metadata:
  name: live-rank-split-demo
  namespace: default
spec:
  mode: live-rank-split
  checkpoint:
    format: dcp
    formatVersion: "1.0.0"
  source:
    metadataOwnerRank: 0
    worldSize: 4
    mesh:
      shape: [4]
      placements: ["Shard(0)"]
    rankMap:
      - rank: 0
        endpoint: http://source-0:9443
      - rank: 1
        endpoint: http://source-1:9443
      - rank: 2
        endpoint: http://source-2:9443
      - rank: 3
        endpoint: http://source-3:9443
    checkpointRoot: /checkpoints/job42
  target:
    worldSize: 4
    mesh:
      shape: [4]
      placements: ["Shard(0)"]
    rankMap:
      - rank: 0
        endpoint: http://target-0:9443
      - rank: 1
        endpoint: http://target-1:9443
      - rank: 2
        endpoint: http://target-2:9443
      - rank: 3
        endpoint: http://target-3:9443
    rootTemplate: /targets/job42/rank{rank}
    validation:
      version: step-100000
      steps: 10
      timeoutSeconds: 900
      jobTemplate:
        apiVersion: batch/v1
        kind: Job
        spec:
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: trainer
                  image: ghcr.io/example/trainer:latest
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -eu
                      rank="${JOB_COMPLETION_INDEX:?missing JOB_COMPLETION_INDEX}"
                      checkpoint="${AEVREL_CHECKPOINT_TEMPLATE//\{rank\}/$rank}"
                      state="${AEVREL_STATE_TEMPLATE//\{rank\}/$rank}"
                      echo "rank=${rank} checkpoint=${checkpoint} state=${state}"

                      # The workload must fail if state or checkpoint is incomplete.
                      python train_resume.py \
                        --checkpoint "$checkpoint" \
                        --state "$state" \
                        --state-providers "$AEVREL_STATE_PROVIDERS" \
                        --world-size "$AEVREL_TARGET_WORLD_SIZE" \
                        --steps "$AEVREL_VALIDATION_STEPS"

                      aevrel-target-report \
                        --model-loaded \
                        --optimizer-loaded \
                        --state-complete \
                        --steps-ran "$AEVREL_VALIDATION_STEPS"
                  volumeMounts:
                    - name: target-local
                      mountPath: /targets
                    - name: live-state
                      mountPath: /state
              volumes:
                - name: target-local
                  hostPath:
                    path: /var/lib/aevrel/target
                    type: Directory
                - name: live-state
                  hostPath:
                    path: /var/lib/aevrel/live-state
                    type: Directory
  live:
    maxInFlight: 2
    stateMode: L4
    stateRoot: /state/step-100000/rank{rank}
    stateProviders:
      - python.random
      - numpy.random
      - torch.cpu.rng
      - training.state
    handoffEndpoint: http://lrs-handoff.live.svc:9460
    cutover:
      quorum: 3
      requireStateComplete: true
    rankPlan:
      tp: 2
      pp: 2
      ranks: [0, 1, 2, 3]
  policy:
    verify: bitwise
    commit: all-or-nothing
    maxConcurrentTransfers: 16
    maxAttemptsPerRank: 5
    timeoutSeconds: 3600
    sourceChunkCacheBytes: 2147483648
  artifacts:
    store: pvc
    claimName: aevrel-artifacts
