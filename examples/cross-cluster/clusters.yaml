# Apply this file in the management cluster.
apiVersion: v1
kind: Secret
metadata:
  name: source-gateway-auth
  namespace: shardferry-control
stringData:
  token: replace-with-source-gateway-token
---
apiVersion: v1
kind: Secret
metadata:
  name: target-gateway-auth
  namespace: shardferry-control
stringData:
  token: replace-with-target-gateway-token
---
apiVersion: shardferry.io/v1
kind: ShardferryCluster
metadata:
  name: source
  namespace: shardferry-control
spec:
  role: source
  endpoint: https://SOURCE_GATEWAY_HOST:9445
  secretRef:
    name: source-gateway-auth
    key: token
  description: source training cluster
---
apiVersion: shardferry.io/v1
kind: ShardferryCluster
metadata:
  name: target
  namespace: shardferry-control
spec:
  role: target
  endpoint: https://TARGET_GATEWAY_HOST:9445
  secretRef:
    name: target-gateway-auth
    key: token
  description: target training cluster
