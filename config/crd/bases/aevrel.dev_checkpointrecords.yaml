---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: checkpointrecords.aevrel.dev
spec:
  group: aevrel.dev
  names:
    kind: CheckpointRecord
    listKind: CheckpointRecordList
    plural: checkpointrecords
    shortNames:
    - sfcr
    singular: checkpointrecord
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              agentEndpoint:
                description: |-
                  AgentEndpoint observes one explicit agent. Mutually exclusive with
                  AgentSelector.
                type: string
              agentSecretRef:
                description: ClusterSecretRef points at the bearer token used to call
                  a cluster gateway.
                properties:
                  key:
                    description: Key defaults to token.
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              agentSelector:
                description: |-
                  AgentSelector discovers every ready agent pod and merges their local
                  checkpoint facts. Mutually exclusive with AgentEndpoint.
                properties:
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: MatchLabels selects agent pods by their labels.
                    type: object
                  namespace:
                    description: Namespace defaults to the CheckpointMigration namespace
                      when empty.
                    type: string
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  scheme:
                    enum:
                    - http
                    - https
                    type: string
                type: object
              checkpoint:
                minLength: 1
                type: string
              formatVersion:
                type: string
              jobRef:
                minLength: 1
                type: string
              provider:
                type: string
              requireStateComplete:
                description: |-
                  RequireStateComplete turns the readiness assessment into an L4 claim:
                  the record may not read READY unless the resume-state closure is
                  complete.
                type: boolean
              sourceWorldSize:
                format: int32
                minimum: 1
                type: integer
              step:
                format: int64
                type: integer
              version:
                minLength: 1
                type: string
            required:
            - checkpoint
            - formatVersion
            - jobRef
            - provider
            - sourceWorldSize
            - version
            type: object
          status:
            properties:
              complete:
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              fresh:
                type: boolean
              latestMtime:
                type: string
              metadataDigest:
                type: string
              ranks:
                items:
                  properties:
                    bytes:
                      format: int64
                      type: integer
                    rank:
                      format: int32
                      type: integer
                    shards:
                      items:
                        properties:
                          length:
                            format: int64
                            type: integer
                          name:
                            type: string
                          offset:
                            format: int64
                            type: integer
                          rank:
                            format: int32
                            type: integer
                          relativePath:
                            type: string
                          sizeBytes:
                            format: int64
                            type: integer
                        required:
                        - length
                        - name
                        - offset
                        - rank
                        - relativePath
                        - sizeBytes
                        type: object
                      type: array
                  required:
                  - bytes
                  - rank
                  type: object
                type: array
              readiness:
                properties:
                  complete:
                    type: boolean
                  estimatedRTOSeconds:
                    format: int64
                    type: integer
                  fresh:
                    type: boolean
                  lastDrill:
                    type: string
                  lastDrillDigest:
                    type: string
                  lastDrillVersion:
                    type: string
                  loadable:
                    type: boolean
                  movable:
                    type: boolean
                  observedAt:
                    type: string
                  readinessLevel:
                    description: |-
                      ReadinessLevel is L3 (bytes verified) or L4 (closure verified and
                      anchored to the manifest a restore drill actually used).
                    type: string
                  reasons:
                    items:
                      properties:
                        code:
                          minLength: 1
                          type: string
                        detail:
                          type: string
                      required:
                      - code
                      - detail
                      type: object
                    type: array
                  resumeClosure:
                    description: ResumeClosure is the closure verdict the agents reported.
                    type: string
                  resumeManifestDigest:
                    description: ResumeManifestDigest binds that verdict to one manifest.
                    type: string
                  resumeReasonCodes:
                    description: ResumeReasonCodes lists the closure reasons, sorted.
                    items:
                      type: string
                    type: array
                  stateComplete:
                    description: |-
                      StateComplete reports the resume-state closure as observed by the
                      agents. It is a pointer so "no agent reported closure evidence" stays
                      distinguishable from "the closure is incomplete".
                    type: boolean
                  status:
                    type: string
                  targetWorldSize:
                    format: int32
                    type: integer
                required:
                - complete
                - fresh
                - loadable
                - movable
                - observedAt
                - status
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
