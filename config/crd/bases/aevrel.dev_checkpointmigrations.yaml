---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: checkpointmigrations.aevrel.dev
spec:
  group: aevrel.dev
  names:
    kind: CheckpointMigration
    listKind: CheckpointMigrationList
    plural: checkpointmigrations
    singular: checkpointmigration
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CheckpointMigrationSpec defines the desired migration.
            properties:
              artifacts:
                description: ArtifactSpec describes where plan/report artifacts live.
                properties:
                  bucket:
                    type: string
                  claimName:
                    type: string
                  prefix:
                    type: string
                  store:
                    enum:
                    - pvc
                    - s3
                    type: string
                required:
                - store
                type: object
              checkpoint:
                description: CheckpointSpec describes the supported checkpoint format.
                properties:
                  format:
                    enum:
                    - dcp
                    type: string
                  formatVersion:
                    minLength: 1
                    type: string
                required:
                - format
                - formatVersion
                type: object
              live:
                description: |-
                  LiveRankSplitSpec configures a live rank split. The source and target
                  clusters share a logical world size; ranks move while the remaining ranks
                  continue the same synchronous step.
                properties:
                  cutover:
                    description: LiveCutoverSpec describes the quorum/fencing contract
                      at cutover.
                    properties:
                      quorum:
                        description: Quorum defaults to floor(source.worldSize/2)+1.
                        format: int32
                        minimum: 0
                        type: integer
                      requireStateComplete:
                        default: true
                        type: boolean
                    type: object
                  handoffEndpoint:
                    description: HandoffEndpoint is the live state handoff service.
                    type: string
                  maxInFlight:
                    description: MaxInFlight is F, the maximum number of concurrently
                      moving ranks.
                    format: int32
                    minimum: 1
                    type: integer
                  rankPlan:
                    description: |-
                      LiveRankPlanSpec describes the TP/PP layout and the logical ranks that may
                      be in flight during a live rank split.
                    properties:
                      pp:
                        format: int32
                        minimum: 0
                        type: integer
                      ranks:
                        description: Ranks are logical source ranks that may be in
                          flight.
                        items:
                          format: int32
                          type: integer
                        type: array
                      tp:
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                  stateMode:
                    default: L4
                    enum:
                    - L3
                    - L4
                    type: string
                  stateProviders:
                    description: StateProviders is the explicit provider list for
                      the bundle.
                    items:
                      type: string
                    type: array
                  stateRoot:
                    description: StateRoot is the rank-local state bundle root on
                      the source.
                    minLength: 1
                    type: string
                required:
                - maxInFlight
                - stateRoot
                type: object
              mode:
                default: static
                enum:
                - static
                - live-rank-split
                type: string
              policy:
                description: PolicySpec describes migration safety and concurrency
                  policy.
                properties:
                  commit:
                    enum:
                    - all-or-nothing
                    type: string
                  maxAttemptsPerRank:
                    format: int32
                    minimum: 1
                    type: integer
                  maxConcurrentTransfers:
                    format: int32
                    minimum: 1
                    type: integer
                  sourceChunkCacheBytes:
                    format: int64
                    minimum: 1
                    type: integer
                  timeoutSeconds:
                    format: int64
                    minimum: 1
                    type: integer
                  verify:
                    enum:
                    - bitwise
                    type: string
                required:
                - commit
                - maxAttemptsPerRank
                - maxConcurrentTransfers
                - sourceChunkCacheBytes
                - timeoutSeconds
                - verify
                type: object
              source:
                description: SourceSpec describes the source checkpoint location and
                  topology.
                properties:
                  agentSelector:
                    description: AgentSelector discovers agent pods for a migration.
                    properties:
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels selects agent pods by their labels.
                        type: object
                      namespace:
                        description: Namespace defaults to the CheckpointMigration
                          namespace when empty.
                        type: string
                      port:
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      scheme:
                        enum:
                        - http
                        - https
                        type: string
                    type: object
                  checkpointRoot:
                    minLength: 1
                    type: string
                  clusterRef:
                    type: string
                  mesh:
                    description: MeshSpec describes a DeviceMesh.
                    properties:
                      placements:
                        items:
                          type: string
                        minItems: 1
                        type: array
                      shape:
                        items:
                          format: int32
                          type: integer
                        minItems: 1
                        type: array
                    required:
                    - placements
                    - shape
                    type: object
                  metadataOwnerRank:
                    format: int32
                    minimum: 0
                    type: integer
                  rankMap:
                    items:
                      description: RankEndpoint maps one rank to an agent endpoint.
                      properties:
                        endpoint:
                          minLength: 1
                          type: string
                        rank:
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - endpoint
                      - rank
                      type: object
                    type: array
                  worldSize:
                    format: int32
                    maximum: 256
                    minimum: 1
                    type: integer
                required:
                - checkpointRoot
                - mesh
                - metadataOwnerRank
                - worldSize
                type: object
              target:
                description: TargetSpec describes the target topology and local roots.
                properties:
                  agentSelector:
                    description: AgentSelector discovers agent pods for a migration.
                    properties:
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels selects agent pods by their labels.
                        type: object
                      namespace:
                        description: Namespace defaults to the CheckpointMigration
                          namespace when empty.
                        type: string
                      port:
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      scheme:
                        enum:
                        - http
                        - https
                        type: string
                    type: object
                  clusterRef:
                    type: string
                  mesh:
                    description: MeshSpec describes a DeviceMesh.
                    properties:
                      placements:
                        items:
                          type: string
                        minItems: 1
                        type: array
                      shape:
                        items:
                          format: int32
                          type: integer
                        minItems: 1
                        type: array
                    required:
                    - placements
                    - shape
                    type: object
                  rankMap:
                    items:
                      description: RankEndpoint maps one rank to an agent endpoint.
                      properties:
                        endpoint:
                          minLength: 1
                          type: string
                        rank:
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - endpoint
                      - rank
                      type: object
                    type: array
                  rootTemplate:
                    minLength: 1
                    type: string
                  validation:
                    description: |-
                      TargetValidationSpec describes the target training workload used to prove
                      that the committed checkpoint can actually be loaded and resumed.
                    properties:
                      jobName:
                        description: JobName observes an existing Job instead of creating
                          one from JobTemplate.
                        type: string
                      jobTemplate:
                        description: |-
                          JobTemplate is a batch/v1 Job with one Indexed Pod per target rank.
                          aevrel injects the checkpoint and report contract into every
                          container before creating it.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      steps:
                        default: 10
                        description: Steps is the minimum number of training steps
                          every target rank must run.
                        format: int32
                        minimum: 1
                        type: integer
                      timeoutSeconds:
                        default: 600
                        description: TimeoutSeconds bounds the validation Job lifetime.
                        format: int64
                        minimum: 1
                        type: integer
                      version:
                        description: Version is the checkpoint version/step the target
                          must load.
                        minLength: 1
                        type: string
                    required:
                    - version
                    type: object
                  worldSize:
                    format: int32
                    maximum: 256
                    minimum: 1
                    type: integer
                required:
                - mesh
                - rootTemplate
                - worldSize
                type: object
            required:
            - artifacts
            - checkpoint
            - policy
            - source
            - target
            type: object
          status:
            description: CheckpointMigrationStatus is the observed migration state.
            properties:
              commitToken:
                type: string
              completedAt:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              counts:
                description: RankCounts is a summary of rank states.
                properties:
                  committed:
                    format: int32
                    type: integer
                  failed:
                    format: int32
                    type: integer
                  prepared:
                    format: int32
                    type: integer
                  staged:
                    format: int32
                    type: integer
                required:
                - committed
                - failed
                - prepared
                - staged
                type: object
              cutoverPhase:
                enum:
                - following
                - catching-up
                - target-verified
                - promoting
                - promoted
                - commit-incomplete
                - failed
                - cancelled
                type: string
              executionRef:
                type: string
              failedRanks:
                items:
                  format: int32
                  type: integer
                type: array
              live:
                description: LiveRankSplitStatus is the observed live rank split state.
                properties:
                  completedAt:
                    type: string
                  coverage:
                    items:
                      format: int32
                      type: integer
                    type: array
                  cutoverPhase:
                    enum:
                    - pending
                    - preflight
                    - draining
                    - snapshotting
                    - following
                    - cutover
                    - target-validating
                    - succeeded
                    - failed
                    - cancelled
                    type: string
                  inFlight:
                    items:
                      format: int32
                      type: integer
                    type: array
                  message:
                    type: string
                  proofRef:
                    type: string
                  quorum:
                    format: int32
                    type: integer
                  ranks:
                    items:
                      description: LiveRankStatus is the observed state of one logical
                        rank in a live split.
                      properties:
                        epoch:
                          format: int64
                          type: integer
                        error:
                          type: string
                        owner:
                          format: int32
                          type: integer
                        phase:
                          type: string
                        rank:
                          format: int32
                          type: integer
                        retries:
                          format: int32
                          type: integer
                      required:
                      - phase
                      - rank
                      type: object
                    type: array
                  stateComplete:
                    type: boolean
                  stateRoot:
                    type: string
                type: object
              phase:
                enum:
                - pending
                - preparing
                - transferring
                - commit-pending
                - committing
                - target-validating
                - target-failed
                - succeeded
                - failed
                - cancelled
                - commit-incomplete
                type: string
              planHash:
                type: string
              planRef:
                type: string
              proofHash:
                type: string
              proofRef:
                type: string
              ranks:
                items:
                  description: RankStatus is the observed state of one target rank.
                  properties:
                    attempts:
                      format: int32
                      type: integer
                    error:
                      type: string
                    phase:
                      type: string
                    rank:
                      format: int32
                      type: integer
                    taskID:
                      type: string
                  required:
                  - phase
                  - rank
                  type: object
                type: array
              reportRef:
                type: string
              startedAt:
                type: string
              targetReady:
                description: |-
                  TargetReadyStatus proves whether the target workload loaded the committed
                  checkpoint and continued training for the required number of steps.
                properties:
                  completedAt:
                    type: string
                  condition:
                    enum:
                    - Pending
                    - Ready
                    - LoadFailed
                    - StepFailed
                    - VersionMismatch
                    - Timeout
                    - JobFailed
                    - Incomplete
                    - InvalidJob
                    - InvalidReport
                    - Unsupported
                    - StateClosureIncomplete
                    - ProofPublishFailed
                    type: string
                  durationMilliseconds:
                    format: int64
                    type: integer
                  jobName:
                    type: string
                  message:
                    type: string
                  proofHash:
                    type: string
                  proofRef:
                    type: string
                  ranks:
                    items:
                      description: TargetReadyRankStatus is the observed target validation
                        state of one rank.
                      properties:
                        error:
                          type: string
                        modelLoaded:
                          type: boolean
                        ok:
                          type: boolean
                        optimizerLoaded:
                          type: boolean
                        rank:
                          format: int32
                          type: integer
                        stateComplete:
                          type: boolean
                        stepsRan:
                          format: int32
                          type: integer
                      required:
                      - modelLoaded
                      - ok
                      - optimizerLoaded
                      - rank
                      - stateComplete
                      - stepsRan
                      type: object
                    type: array
                  ranksReady:
                    format: int32
                    type: integer
                  ranksTotal:
                    format: int32
                    type: integer
                  ready:
                    type: boolean
                  startedAt:
                    type: string
                  stateComplete:
                    type: boolean
                  stepsRan:
                    format: int32
                    type: integer
                  version:
                    type: string
                required:
                - ranksReady
                - ranksTotal
                - ready
                - stateComplete
                - stepsRan
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
