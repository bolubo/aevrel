name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Python environment is cached as a whole: interpreter links, the
      # editable install and torch. A hit is verified by importing what the
      # suite actually needs, so a stale or path-shifted cache rebuilds rather
      # than failing the run for the wrong reason.
      - name: Restore the Python environment
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pip
          key: pyenv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Build the Python environment
        run: |
          if .venv/bin/python -c "import aevrel, torch" >/dev/null 2>&1; then
            echo "python environment restored from cache"
            exit 0
          fi
          rm -rf .venv
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
          .venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Use the cached interpreter
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      # The compiled crate is shared with the `native` job under the same key,
      # so it is built at most once per Cargo.lock instead of once per job.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/aevrel-fast/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/aevrel-fast/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      # The data plane has no Python fallback: the chunker binary and the
      # in-process kernels are both required, so the tests fail rather than
      # skip when these artefacts are missing.
      - run: cargo build --release --manifest-path native/aevrel-fast/Cargo.toml
      - run: python -m compileall -q src tests scripts
      - run: python scripts/check_repo.py
      - run: python tests/acceptance/verify_line2_acceptance.py
      - run: python tests/acceptance/verify_line3_acceptance.py
      # One worker per core, whole files per worker: the suite is independent,
      # but a file's module-level state must stay on one worker as it does in
      # a serial run.
      #
      # Coverage runs on this same pass rather than a second one, and the floor
      # turns a quiet regression into a red job. 81.59% was measured on the run
      # that introduced this step, so the floor sits 0.59pp under it — about 75
      # statements, which is what deleting a real test file costs. It is not a
      # target and it is not "today's number" frozen: it moves up with the tests
      # that earn it, never down. See CONTRIBUTING, "Validation".
      - run: python -m pytest -q -n auto --dist loadfile --cov=aevrel --cov-report=term-missing --cov-fail-under=81
      - run: python scripts/check_release.py --json
      - run: python scripts/acceptance.py --work-dir /tmp/aevrel-acceptance
      - run: python scripts/product_acceptance.py
      - run: python scripts/first_run_acceptance.py

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/aevrel-fast
    steps:
      - uses: actions/checkout@v7
      # Share the compiled target with the `python` job: both build the same
      # crate, so the second job to run starts warm instead of recompiling it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/aevrel-fast/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/aevrel-fast/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      # `rustup` and a stable toolchain ship on the runner image; using them
      # directly keeps the workflow free of third-party actions.
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: |
          fmt="$(go env GOROOT)/bin/gofmt"
          test -z "$("$fmt" -l cmd internal api)"
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build ./cmd/controller ./cmd/ctl ./cmd/gateway ./cmd/kueue-adapter
      # `migrate --dry-run` is the offline end-to-end path of the CLI. It used
      # to run inside the Python job, which has no Go cache; here the build
      # cache is already warm from the steps above.
      - name: ctl dry-run keeps the agent selector in the rendered resource
        run: |
          out="$(go run ./cmd/ctl migrate -f examples/k8s/migration.yaml --dry-run)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q agentSelector

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.2
      - run: helm lint deploy/helm/aevrel
      # The non-TLS branch is a separate template path. It used to be linted
      # from the Python job, which had no Helm setup; this job owns it now.
      - run: helm lint deploy/helm/aevrel --set tls.enabled=false
      - run: helm template aevrel deploy/helm/aevrel --include-crds > /tmp/aevrel.yaml
      - run: >-
          helm template aevrel deploy/helm/aevrel --include-crds
          --set liveWorker.enabled=true
          --set kueueAdapter.enabled=true
          > /tmp/aevrel-all-components.yaml

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [live-worker, kueue-adapter]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - run: docker build --build-arg BUILDKIT_INLINE_CACHE=1 -f deploy/docker/Dockerfile.${{ matrix.component }} -t aevrel-${{ matrix.component }}:ci .
