name: Feature request
description: Propose a user-facing capability or design change
labels: ["kind/feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the real workflow and who encounters it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This changes the checkpoint control plane or readiness semantics.
        - label: This changes the checkpoint data plane or commit semantics.
        - label: This is specific to the Kubernetes/controller path.
        - label: This is specific to LRS, Kueue, or another adapter.
        - label: This is documentation or developer tooling only.
