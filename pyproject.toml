[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shardferry"
version = "0.2.0-rc.1"
description = "Scheduler-neutral training-state control plane for AI infrastructure."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "shardferry contributors" }]
keywords = [
  "ai-infrastructure",
  "checkpoint",
  "kubernetes",
  "pytorch",
  "scheduler",
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Go",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "pytest-cov>=5.0",
]
dcp = [
  "torch>=2.9",
]
gpu = [
  "nvidia-nvcomp-cu12>=6.0.0.12",
]

[project.scripts]
shardferry = "shardferry.cli:main"
shardferry-target-load = "shardferry.commands.target_load:main"
shardferry-target-report = "shardferry.commands.target_report:main"
shardferry-support-bundle = "shardferry.commands.support_bundle:main"
shardferry-live-worker = "shardferry.commands.live_worker:main"

[project.urls]
Homepage = "https://github.com/bolubo/shardferry"
Repository = "https://github.com/bolubo/shardferry"
Issues = "https://github.com/bolubo/shardferry/issues"
Documentation = "https://github.com/bolubo/shardferry/blob/main/docs/INDEX.zh-CN.md"
Changelog = "https://github.com/bolubo/shardferry/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "phase0: scaffolding checks",
  "xfail_until: documented placeholder for a later phase",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shardferry"]

[tool.hatch.build.targets.wheel.force-include]
"spec" = "shardferry/spec"
