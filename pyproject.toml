[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shardferry"
version = "0.1.0"
description = "Move and reshard local checkpoint shards across DeviceMeshes and clusters."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "shardferry contributors" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Go",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "pytest-cov>=5.0",
]
dcp = [
  "torch>=2.9",
]

[project.scripts]
shardferry = "shardferry.cli:main"

[project.urls]
Homepage = "https://github.com/bolubo/shardferry"
Repository = "https://github.com/bolubo/shardferry"
Issues = "https://github.com/bolubo/shardferry/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "phase0: scaffolding checks",
  "xfail_until: documented placeholder for a later phase",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shardferry"]
